name: Globe rendering

on:
  pull_request:
    paths:
      - 'src/components/GlobeScene.tsx'
      - 'src/components/MorphingGlobe.tsx'
      - 'src/constants/globe*'
      - 'src/lib/globe/**'
      - 'src/pages/Index.tsx'
      - 'tests/browser/**'
      - 'scripts/globe-rendering-smoke.mjs'
      - '.github/workflows/globe-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/components/GlobeScene.tsx'
      - 'src/components/MorphingGlobe.tsx'
      - 'src/constants/globe*'
      - 'src/lib/globe/**'
      - 'tests/browser/**'
      - 'scripts/globe-rendering-smoke.mjs'
      - '.github/workflows/globe-smoke.yml'

jobs:
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install browser smoke runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check lighting, morphing, picking and portrait projection
        run: node scripts/globe-rendering-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globe-rendering-screenshots
          path: test-results/globe
          if-no-files-found: ignore
